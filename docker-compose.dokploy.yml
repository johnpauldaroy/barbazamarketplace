services:
  frontend:
    build:
      context: ./barbazamarketplace
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: "EkooMart"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://ekoopmart.barbazampc.cloud
      APP_TIMEZONE: Asia/Singapore
      APP_KEY: ${APP_KEY}
      FRONTEND_URL: https://ekoopmart.barbazampc.cloud
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: ekoopmart-database-mxj1xp
      DB_PORT: "3306"
      DB_DATABASE: ekoopmart
      DB_USERNAME: ekoopmart_user
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "1"
      MIGRATION_MAX_ATTEMPTS: "30"
      CORS_ALLOWED_ORIGINS: https://ekoopmart.barbazampc.cloud
      CORS_ALLOWED_ORIGINS_PATTERNS: ""
    volumes:
      - backend_storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  backend_storage:
