map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy /api to Laravel on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Serve uploaded files directly from the storage volume
    # This must come BEFORE the static asset cache rule so .jpg/.png
    # under /storage/ are served from disk, not proxied to Laravel
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # React app — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache React build static assets (NOT /storage — handled above)
    location ~* ^(?!/storage/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
