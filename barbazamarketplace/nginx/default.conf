map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Product photos come straight off phones and routinely exceed nginx's
    # 1MB default, which would reject the upload before it reaches Laravel.
    client_max_body_size 12M;

    # Browser hardening headers. CSP is scoped to what the SPA actually uses:
    # same-origin script/api/img, plus Google Fonts for the two webfonts
    # imported in src/index.css. Payment-proof images are opened via blob:
    # URLs (see openOrderPaymentProof), so img-src allows blob:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy /api to Laravel on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy uploaded files to Laravel (same upstream as /api/ above) instead of
    # reading them off local disk. `php artisan serve` already serves files
    # under public/ (including the public/storage symlink) directly, so this
    # is a thin passthrough — but going through PHP keeps one code path for
    # both containerized and split deployments, and sidesteps alias/symlink
    # path quirks. This must come BEFORE the static asset cache rule so
    # .jpg/.png under /storage/ are proxied, not looked up in the React build.
    location /storage/ {
        proxy_pass http://127.0.0.1:8000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        expires 30d;
        add_header Cache-Control "public";
    }

    # React app — SPA fallback.
    # index.html must never be cached: it names the hashed bundles, so a stale
    # copy keeps pointing browsers at an old build after every deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Cache React build static assets (NOT /storage — handled above)
    location ~* ^(?!/storage/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
